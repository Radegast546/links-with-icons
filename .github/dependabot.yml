version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Obsidian pins editor peer dependencies; update these together.
      obsidian-editor:
        patterns:
          - obsidian
          - '@codemirror/*'
      development-tools:
        patterns: ['*']
        exclude-patterns:
          - obsidian
          - '@codemirror/*'
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
